<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tauranga</title>
  <link rel="icon" href="assets/260421_tauranga_favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #001D32;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .logo {
      position: relative;
      width: min(65vw, 1046px);
      height: auto;
      overflow: visible;
    }

    .logo path {
      transform-box: fill-box;
      transform-origin: center center;
      will-change: transform;
      cursor: grab;
      touch-action: none;
    }

    .logo path.dragging {
      cursor: grabbing;
    }

    /* ---- Wave type label (corner) ---- */

    .wave-hud {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      margin: 0;
      padding: 11px 22px;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.3s ease, background 0.3s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    .wave-hud:hover {
      border-color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>

  <script>
    const logoSvg = document.getElementById('logo');
    const container = document.querySelector('.container');

    const LOGO_VB_W = 1046;
    const LOGO_VB_H = 155;
    const LOGO_CX = LOGO_VB_W / 2;
    const LOGO_CY = LOGO_VB_H / 2;

    // Template scatter layout; translateOnly = never scale (U right/left, N left/right only).
    const SCATTER_BASE = [
      { fx: -0.38, fy: -0.18, s: 2.2 },
      { fx: -0.42, fy:  0.12, s: 2.4 },
      { fx: -0.36, fy: -0.36, s: 2.8 },
      { fx: -0.20, fy: -0.14, s: 2.0 },
      { fx: -0.26, fy:  0.30, s: 2.2 },
      { fx: -0.06, fy: -0.32, s: 2.6 },
      { fx:  0.02, fy:  0.18, s: 1.8, translateOnly: true },
      { fx: -0.16, fy:  0.08, s: 2.0, translateOnly: true },
      { fx: -0.32, fy:  0.28, s: 2.0 },
      { fx:  0.10, fy: -0.35, s: 2.6 },
      { fx:  0.06, fy:  0.30, s: 2.2 },
      { fx:  0.18, fy: -0.18, s: 2.0 },
      { fx:  0.16, fy:  0.32, s: 2.2 },
      { fx:  0.26, fy: -0.04, s: 1.8, translateOnly: true },
      { fx:  0.32, fy: -0.26, s: 2.2 },
      { fx:  0.28, fy:  0.32, s: 1.8, translateOnly: true },
      { fx:  0.40, fy:  0.06, s: 2.8 },
      { fx:  0.38, fy: -0.34, s: 2.2 },
      { fx:  0.44, fy: -0.18, s: 2.0 },
      { fx:  0.42, fy:  0.26, s: 2.4 },
    ];

    function cloneScatterPlanFromBase() {
      return SCATTER_BASE.map(b => ({
        fx: b.fx,
        fy: b.fy,
        s: b.translateOnly ? 1 : b.s,
        translateOnly: !!b.translateOnly,
      }));
    }

    let scatterPlan = cloneScatterPlanFromBase();

    // Build shape state array
    const shapes = [];
    const pathEls = logoSvg.querySelectorAll('path');
    const pathOrder = Array.from(pathEls);

    pathEls.forEach((el, i) => {
      const base = SCATTER_BASE[i];
      const bbox = el.getBBox();
      const translateOnly = !!base.translateOnly;
      const area = Math.max(bbox.width * bbox.height, 1);
      const mass = Math.max(0.75, Math.min(3.2, Math.sqrt(area) / 28));
      shapes.push({
        el,
        originX: bbox.x + bbox.width / 2,
        originY: bbox.y + bbox.height / 2,
        layoutX: 0,
        layoutY: 0,
        currentScale: 1,
        momX: 0,
        momY: 0,
        velX: 0,
        velY: 0,
        scatterX: 0,
        scatterY: 0,
        scatterScale: translateOnly ? 1 : base.s,
        translateOnly,
        mass,
        speed: 0.01 + Math.random() * 0.012,
        /** When exiting play zone, scale snaps down faster than translation (see animate). */
        scaleReturnBoost: 4.2 + Math.random() * 0.8,
        idleFreqX: 0.25 + Math.random() * 0.35,
        idleFreqY: 0.20 + Math.random() * 0.30,
        idlePhase: Math.random() * Math.PI * 2,
        idleAmp: 1.0 + Math.random() * 1.5,
      });
    });

    // Compute pixel-space scatter offsets
    function computeScatterOffsets() {
      const svgRect = logoSvg.getBoundingClientRect();
      const pxPerUnit = svgRect.width / LOGO_VB_W;
      const svgScreenCX = svgRect.left + svgRect.width / 2;
      const svgScreenCY = svgRect.top + svgRect.height / 2;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      shapes.forEach((shape, i) => {
        const p = scatterPlan[i];
        const targetPxX = vw * (0.5 + p.fx);
        const targetPxY = vh * (0.5 + p.fy);
        const homePxX = svgScreenCX + (shape.originX - LOGO_CX) * pxPerUnit;
        const homePxY = svgScreenCY + (shape.originY - LOGO_CY) * pxPerUnit;
        shape.scatterX = targetPxX - homePxX;
        shape.scatterY = targetPxY - homePxY;
      });
    }

    function rollScatterLayout() {
      const fxJitter = 0.2;
      const fyJitter = 0.185;
      const globalFx = (Math.random() - 0.5) * 0.09;
      const globalFy = (Math.random() - 0.5) * 0.08;
      scatterPlan = SCATTER_BASE.map(base => {
        let fx = base.fx + (Math.random() - 0.5) * 2 * fxJitter + globalFx;
        let fy = base.fy + (Math.random() - 0.5) * 2 * fyJitter + globalFy;
        if (Math.random() < 0.4) {
          fx += (Math.random() - 0.5) * 0.11;
          fy += (Math.random() - 0.5) * 0.11;
        }
        fx = Math.max(-0.49, Math.min(0.49, fx));
        fy = Math.max(-0.44, Math.min(0.44, fy));
        const translateOnly = !!base.translateOnly;
        let s = 1;
        if (!translateOnly) {
          s = base.s * (0.68 + Math.random() * 0.62);
          s = Math.max(1.28, Math.min(3.45, s));
        }
        return { fx, fy, s, translateOnly };
      });
      computeScatterOffsets();
      shapes.forEach((shape, i) => {
        shape.scatterScale = scatterPlan[i].translateOnly ? 1 : scatterPlan[i].s;
      });
    }

    computeScatterOffsets();

    // Mouse tracking
    let mouseActive = false;
    let mouseX = 0;
    let mouseY = 0;

    container.addEventListener('mousemove', e => {
      mouseActive = true;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    container.addEventListener('mouseleave', () => {
      mouseActive = false;
    });

    const REST_PAD = 50;
    const EXPANDED_FRAC_W = 0.9;
    const EXPANDED_FRAC_H = 0.9;
    /** 0 = resting pad, 1 = expanded; lerps much faster than the shapes. */
    let padT = 0;
    let expandedMode = false;
    let wasInResting = false;
    let wasInExpanded = false;
    /** True after leaving the expanded hover pad (90vw×90vh) or the view; new layout on next expanded entry. */
    let pendingScatterRoll = false;

    /** Pointer drag + inertia (honours layout lerp from hover pad / resting). */
    let draggingShape = null;
    let dragPointerId = null;
    let dragLastClientX = 0;
    let dragLastClientY = 0;
    let dragLastTime = 0;
    const MOM_EPS = 0.35;
    const VEL_EPS = 0.02;
    /** Extra velocity damping per frame unit (higher = thicker air). */
    const AIR_DRAG = 0.988;

    function frictionForMass(mass, dt) {
      const base = 0.965 + (mass - 0.75) * 0.0024;
      return Math.pow(Math.max(0.955, Math.min(0.978, base)), dt);
    }

    function shapeFromEventTarget(target) {
      if (!target || !logoSvg.contains(target)) return null;
      const path = target.closest && target.closest('path');
      if (!path || !logoSvg.contains(path)) return null;
      return shapes.find(s => s.el === path) || null;
    }

    function getRestingZone() {
      const r = logoSvg.getBoundingClientRect();
      return {
        left: r.left - REST_PAD,
        top: r.top - REST_PAD,
        right: r.right + REST_PAD,
        bottom: r.bottom + REST_PAD,
      };
    }

    function getExpandedZone() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const w = vw * EXPANDED_FRAC_W;
      const h = vh * EXPANDED_FRAC_H;
      const left = (vw - w) / 2;
      const top = (vh - h) / 2;
      return { left, top, right: left + w, bottom: top + h, w, h, vw, vh };
    }

    function pointInRect(px, py, r) {
      return px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
    }

    /** Normalized cursor in expanded zone (−1…1), viewport-centered. */
    function parallaxNudge(z) {
      const cx = z.vw * 0.5;
      const cy = z.vh * 0.5;
      const halfW = Math.max(z.w * 0.5, 8);
      const halfH = Math.max(z.h * 0.5, 8);
      const nx = (mouseX - cx) / halfW;
      const ny = (mouseY - cy) / halfH;
      return {
        nx: Math.max(-1, Math.min(1, nx)),
        ny: Math.max(-1, Math.min(1, ny)),
      };
    }

    // Animation loop
    let lastTime = performance.now();

    /** Motion while expanded: Still = base Interaction scatter only; others add wave modulation. */
    const WAVE_VARIANT_LABELS = [
      'Still',
      'Swell',
      'Tide',
      'River',
      'Storm',
      'Ripple',
    ];
    let waveVariantFrom = 0;
    let waveVariantTo = 0;
    /** 0…1 while blending from waveVariantFrom → waveVariantTo; 1 = settled. */
    let waveVariantBlendT = 1;
    const WAVE_TRAVEL_LR = 0.22;
    const WAVE_TRAVEL_TB = 0.18;
    /** Ripple: same temporal rate as Swell/River (WAVE_TRAVEL_LR); phase = t*ω − r*k → rings expand outward. */
    const RIPPLE_TIME = WAVE_TRAVEL_LR;
    const RIPPLE_SPATIAL = 5.65;
    const RIPPLE_RADIAL_PX = 42;

    function smoothstep01(t) {
      const x = Math.max(0, Math.min(1, t));
      return x * x * (3 - 2 * x);
    }

    function waveDispForVariant(shape, i, variant, tSec) {
      const sx = shape.scatterX;
      const sy = shape.scatterY;
      const ssc = shape.scatterScale;
      const xNorm = shape.originX / LOGO_VB_W;
      const yNorm = shape.originY / LOGO_VB_H;
      const phaseLR = xNorm * Math.PI * 2 - tSec * WAVE_TRAVEL_LR;
      const phaseTB = yNorm * Math.PI * 2 - tSec * WAVE_TRAVEL_TB;
      const envLR = 0.52 + 0.48 * Math.sin(phaseLR);
      const envTB = 0.52 + 0.48 * Math.sin(phaseTB);

      let tx = 0;
      let ty = 0;
      let sc = 1;

      if (variant === 0) {
        tx = sx;
        ty = sy;
        sc = ssc;
      } else if (variant === 1) {
        tx = sx * envLR;
        ty = sy * envLR;
        sc = shape.translateOnly ? 1 : 1 + (ssc - 1) * envLR;
      } else if (variant === 2) {
        tx = 0;
        ty = sy * envTB;
        sc = shape.translateOnly ? 1 : 1 + (ssc - 1) * envTB;
      } else if (variant === 3) {
        tx = sx * envLR;
        ty = 0;
        sc = shape.translateOnly ? 1 : 1 + (ssc - 1) * envLR;
      } else if (variant === 4) {
        const a = shape.idlePhase + i * 0.73;
        const n1 = Math.sin(tSec * 0.19 + a * 2.1);
        const n2 = Math.cos(tSec * 0.14 + a * 1.3);
        const n3 = Math.sin(tSec * 0.11 + i * 0.91);
        const chaos = 0.38 + 0.31 * n1 + 0.21 * n2 + 0.18 * n3;
        const w = Math.max(0.15, Math.min(1, chaos));
        tx = sx * w;
        ty = sy * w;
        sc = shape.translateOnly ? 1 : 1 + (ssc - 1) * w;
      } else if (variant === 5) {
        let rdx = shape.originX - LOGO_CX;
        let rdy = shape.originY - LOGO_CY;
        if (Math.abs(rdx) < 1e-6 && Math.abs(rdy) < 1e-6) {
          const a = shape.idlePhase;
          rdx = Math.cos(a);
          rdy = Math.sin(a);
        }
        const rVb = Math.max(Math.hypot(rdx, rdy), 1e-3);
        const ux = rdx / rVb;
        const uy = rdy / rVb;
        const r01 = Math.min(rVb / (0.48 * LOGO_VB_W), 1.35);
        const phase = tSec * RIPPLE_TIME - r01 * RIPPLE_SPATIAL;
        const ring = Math.sin(phase);
        const outwardGain = smoothstep01(
          Math.max(0, Math.min(1, (r01 - 0.025) / 0.82))
        );
        const radial = ring * RIPPLE_RADIAL_PX * (0.2 + 0.8 * outwardGain);
        const breathe = 0.57 + 0.43 * (0.5 + 0.5 * ring);
        tx = sx * breathe + ux * radial;
        ty = sy * breathe + uy * radial;
        sc = shape.translateOnly
          ? 1
          : 1 + (ssc - 1) * (0.5 + 0.5 * (0.5 + 0.5 * ring));
      }

      return { tx, ty, sc };
    }

    function animate(time) {
      const rawDt = (time - lastTime) / 16.667;
      const dt = Math.min(rawDt, 4);
      lastTime = time;

      const resting = getRestingZone();
      const expandedZ = getExpandedZone();
      let inExpanded = false;

      const padGrowK = 0.52;
      const padShrinkK = 0.48;

      if (mouseActive) {
          const inResting = pointInRect(mouseX, mouseY, resting);
          inExpanded = pointInRect(mouseX, mouseY, expandedZ);

          if (wasInExpanded && !inExpanded) {
            pendingScatterRoll = true;
          }
          if (inExpanded && !wasInExpanded && pendingScatterRoll) {
            rollScatterLayout();
            pendingScatterRoll = false;
          }

          if (inResting) expandedMode = true;
          else if (!inExpanded) expandedMode = false;

          const targetPadT = expandedMode ? 1 : 0;
          const pk = targetPadT > padT ? padGrowK : padShrinkK;
          const fPad = 1 - Math.pow(1 - pk, dt);
          padT += (targetPadT - padT) * fPad;

          wasInResting = inResting;
          wasInExpanded = inExpanded;
      } else {
        expandedMode = false;
        wasInResting = false;
        wasInExpanded = false;
        pendingScatterRoll = true;
        const fPad = 1 - Math.pow(1 - padShrinkK, dt);
        padT += (0 - padT) * fPad;
      }

      const near = mouseActive && expandedMode && inExpanded;
      const t = time * 0.001;
      const tSec = t;
      const parallaxAmp = 82;
      const { nx, ny } = near ? parallaxNudge(expandedZ) : { nx: 0, ny: 0 };

      if (waveVariantBlendT < 1) {
        waveVariantBlendT = Math.min(1, waveVariantBlendT + dt * 0.024);
        if (waveVariantBlendT >= 1) {
          waveVariantBlendT = 1;
          waveVariantFrom = waveVariantTo;
        }
      }
      const uWaveBlend = smoothstep01(waveVariantBlendT);

      const momSpringK = near ? 0 : 0.022;
      const momDamp = near ? 1 : 0.88;

      shapes.forEach((shape, i) => {
        const idleX = Math.sin(t * shape.idleFreqX + shape.idlePhase) * shape.idleAmp;
        const idleY = Math.sin(t * shape.idleFreqY + shape.idlePhase * 0.7) * shape.idleAmp * 0.7;

        const px = near ? nx * parallaxAmp : 0;
        const py = near ? ny * parallaxAmp : 0;

        let targetX;
        let targetY;
        let targetScale;
        if (near) {
          const A = waveDispForVariant(shape, i, waveVariantFrom, tSec);
          const B = waveDispForVariant(shape, i, waveVariantTo, tSec);
          const wx = A.tx + (B.tx - A.tx) * uWaveBlend;
          const wy = A.ty + (B.ty - A.ty) * uWaveBlend;
          const wsc = A.sc + (B.sc - A.sc) * uWaveBlend;
          targetX = wx + idleX + px;
          targetY = wy + idleY + py;
          targetScale = wsc;
        } else {
          targetX = 0;
          targetY = 0;
          targetScale = 1;
        }

        const sp = shape.speed;
        const fPos = 1 - Math.pow(1 - sp, dt);
        const scaleSp = near
          ? sp
          : Math.min(sp * shape.scaleReturnBoost, 0.22);
        const fScale = 1 - Math.pow(1 - scaleSp, dt);

        if (shape !== draggingShape) {
          shape.layoutX += (targetX - shape.layoutX) * fPos;
          shape.layoutY += (targetY - shape.layoutY) * fPos;
          shape.currentScale += (targetScale - shape.currentScale) * fScale;
        }

        if (shape !== draggingShape) {
          const invM = 1 / shape.mass;
          shape.velX -= shape.momX * momSpringK * dt * invM;
          shape.velY -= shape.momY * momSpringK * dt * invM;
          shape.velX *= momDamp;
          shape.velY *= momDamp;
          const fr = frictionForMass(shape.mass, dt);
          const air = Math.pow(AIR_DRAG, dt);
          shape.velX *= fr * air;
          shape.velY *= fr * air;
          shape.momX += shape.velX * dt;
          shape.momY += shape.velY * dt;
          if (
            Math.abs(shape.momX) < MOM_EPS &&
            Math.abs(shape.momY) < MOM_EPS &&
            Math.abs(shape.velX) < VEL_EPS &&
            Math.abs(shape.velY) < VEL_EPS
          ) {
            shape.momX = 0;
            shape.momY = 0;
            shape.velX = 0;
            shape.velY = 0;
          }
        }

        const tx = shape.layoutX + shape.momX;
        const ty = shape.layoutY + shape.momY;
        shape.el.style.opacity = '1';
        shape.el.style.transform =
          `translate(${tx}px, ${ty}px) scale(${shape.currentScale})`;
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    function attachDragEndGuards() {
      window.addEventListener('pointerup', onWindowPointerEnd, true);
      window.addEventListener('pointercancel', onWindowPointerEnd, true);
      window.addEventListener('pointermove', onDragPointerMove, true);
      window.addEventListener('blur', onWindowBlurEnd);
      document.addEventListener('visibilitychange', onVisibilityChangeEnd);
    }

    function detachDragEndGuards() {
      window.removeEventListener('pointerup', onWindowPointerEnd, true);
      window.removeEventListener('pointercancel', onWindowPointerEnd, true);
      window.removeEventListener('pointermove', onDragPointerMove, true);
      window.removeEventListener('blur', onWindowBlurEnd);
      document.removeEventListener('visibilitychange', onVisibilityChangeEnd);
    }

    function onVisibilityChangeEnd() {
      if (document.visibilityState === 'hidden' && draggingShape) endDrag(null);
    }

    function onWindowPointerEnd(e) {
      if (!draggingShape || e.pointerId !== dragPointerId) return;
      endDrag(e);
    }

    function onWindowBlurEnd() {
      if (draggingShape) endDrag(null);
    }

    function onPointerDown(e) {
      if (e.button !== 0) return;
      const s = shapeFromEventTarget(e.target);
      if (!s) return;
      e.preventDefault();
      draggingShape = s;
      dragPointerId = e.pointerId;
      s.el.classList.add('dragging');
      dragLastClientX = e.clientX;
      dragLastClientY = e.clientY;
      dragLastTime = performance.now();
      s.velX = 0;
      s.velY = 0;
      attachDragEndGuards();
      try {
        s.el.setPointerCapture(e.pointerId);
      } catch (_) {}
      logoSvg.appendChild(s.el);
    }

    function onDragPointerMove(e) {
      if (!draggingShape || e.pointerId !== dragPointerId) return;
      const now = performance.now();
      const dtMove = Math.max(1, now - dragLastTime);
      const dx = e.clientX - dragLastClientX;
      const dy = e.clientY - dragLastClientY;
      draggingShape.momX += dx;
      draggingShape.momY += dy;
      draggingShape.velX = (dx / dtMove) * 16.667;
      draggingShape.velY = (dy / dtMove) * 16.667;
      dragLastClientX = e.clientX;
      dragLastClientY = e.clientY;
      dragLastTime = now;
    }

    function restorePathDomOrder(el) {
      const i = pathOrder.indexOf(el);
      if (i < 0) return;
      const next = pathOrder[i + 1];
      if (next) logoSvg.insertBefore(el, next);
      else logoSvg.appendChild(el);
    }

    function endDrag(e) {
      const s = draggingShape;
      if (!s) return;
      const pid = dragPointerId;
      draggingShape = null;
      dragPointerId = null;
      detachDragEndGuards();

      const fling = 0.78 / Math.sqrt(s.mass);
      s.velX *= fling;
      s.velY *= fling;
      s.el.classList.remove('dragging');
      restorePathDomOrder(s.el);
      if (pid != null) {
        try {
          if (s.el.hasPointerCapture(pid)) s.el.releasePointerCapture(pid);
        } catch (_) {}
      }
    }

    logoSvg.addEventListener('pointerdown', onPointerDown);
    logoSvg.addEventListener('pointerup', e => {
      if (draggingShape && e.pointerId === dragPointerId) endDrag(e);
    });
    logoSvg.addEventListener('pointercancel', e => {
      if (draggingShape && e.pointerId === dragPointerId) endDrag(e);
    });

    // Resize handler
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(computeScatterOffsets, 80);
    });

    const waveHud = document.getElementById('waveHud');
    const waveTypeLabel = document.getElementById('waveTypeLabel');

    waveHud.addEventListener('click', e => {
      e.stopPropagation();
      const prevV = waveVariantTo;
      const nextV = (prevV + 1) % WAVE_VARIANT_LABELS.length;
      waveVariantFrom = prevV;
      waveVariantTo = nextV;
      waveVariantBlendT = 0;
      waveTypeLabel.textContent = WAVE_VARIANT_LABELS[nextV];
    });
  </script>
</body>
</html>
